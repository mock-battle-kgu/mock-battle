name: Compose Integration Test

on:
  pull_request:
    paths:
      - "game-server/**"
      - "api-server/**"
      - "market-engine/**"
      - "docker-compose*.yml"
      - ".github/workflows/compose-integration-test.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI_PROJECT: mockbattle-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MYSQL_DATABASE: mock_battle_test
      MYSQL_USER: mock_user
      MYSQL_PASSWORD: test_mysql_password
      MYSQL_ROOT_PASSWORD: test_root_password
      RABBITMQ_DEFAULT_USER: test_user
      RABBITMQ_DEFAULT_PASS: test_rabbitmq_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-server/package-lock.json

      - name: Install integration test dependencies
        working-directory: game-server
        run: npm ci

      - name: Start Docker Compose
        run: |
          docker compose -p "$CI_PROJECT" \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up -d --build

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend unavailable"
          exit 1

      - name: Run two-player integration test
        id: game
        working-directory: game-server
        env:
          GAME_URL: http://localhost
        run: node scripts/ci-integration.js

      - name: Verify MySQL game result
        env:
          ROOM_ID: ${{ steps.game.outputs.room_id }}
        run: |
          for i in $(seq 1 20); do
            COUNTS=$(docker compose -p "$CI_PROJECT" \
              -f docker-compose.yml \
              -f docker-compose.test.yml \
              exec -T db mysql \
              -N -s \
              -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" \
              "$MYSQL_DATABASE" \
              -e "SELECT
                (SELECT COUNT(*) FROM games
                 WHERE room_id = '$ROOM_ID'),
                (SELECT COUNT(*) FROM game_players gp
                 JOIN games g ON gp.game_id = g.id
                 WHERE g.room_id = '$ROOM_ID');" 2>/dev/null) || true

            echo "Stored records: ${COUNTS:-not yet available}"

            if [[ "$COUNTS" =~ ^1[[:space:]]+2$ ]]; then
              echo "MySQL result verification PASSED"
              exit 0
            fi

            sleep 2
          done

          echo "MySQL result verification FAILED"
          exit 1

      - name: Print Docker logs on failure
        if: failure()
        run: |
          docker compose -p "$CI_PROJECT" \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            logs --tail=200

      - name: Clean up Docker Compose
        if: always()
        run: |
          docker compose -p "$CI_PROJECT" \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            down -v --remove-orphans
