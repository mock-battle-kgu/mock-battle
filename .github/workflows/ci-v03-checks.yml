name: v0.3 Compose checks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'game-server/**'
      - 'api-server/**'
      - 'market-engine/**'
      - 'db/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/ci-v03-checks.yml'
  workflow_dispatch:

jobs:
  v03-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_DATABASE: mockbattle
      MYSQL_USER: mock_user
      MYSQL_PASSWORD: test_mysql_password
      MYSQL_ROOT_PASSWORD: test_root_password
      RABBITMQ_DEFAULT_USER: test_user
      RABBITMQ_DEFAULT_PASS: test_rabbitmq_password
      COMPOSE_PROJECT_NAME: mockbattle-v03-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-server/package-lock.json
      - name: Install socket client dependencies
        working-directory: game-server
        run: npm ci
      - name: Start full Docker Compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
      - name: Wait for API and game proxy
        shell: bash
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost/api/health >/dev/null 2>&1 && curl -fsS http://localhost/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'Compose stack did not become ready' >&2
          exit 1
      - name: Verify stocks API and shared order book
        working-directory: game-server
        env:
          API_URL: http://localhost
          GAME_URL: http://localhost
        run: node scripts/ci-v03-integration.js
      - name: Print logs after failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs --tail=150
      - name: Remove isolated test containers and volumes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans
